<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Multi-Chat</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 統一問題輸入區 -->
    <div class="input-section">
      <textarea id="question-input" data-i18n-placeholder="inputPlaceholder"></textarea>
      <button id="send-all-btn" data-i18n="sendToAllButton"></button>
      <button id="new-chat-btn" data-i18n="newChatButton"></button>
    </div>

    <!-- 4 個 AI iframe -->
    <div class="iframes-container">
      <div class="iframe-wrapper" data-platform="grok">
        <div class="iframe-header" style="background-color: #e74c3c;">
          <div class="header-left">
            <span class="platform-name">Grok</span>
            <button class="toggle-btn enabled" data-platform-toggle="grok" type="button" title="停用 Grok">ON</button>
            <button class="refresh-btn" data-platform="grok" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="grok" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="grok-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="grok-iframe" src="https://grok.com/" allow="clipboard-write; clipboard-read"></iframe>
      </div>

      <div class="iframe-wrapper" data-platform="gemini">
        <div class="iframe-header" style="background-color: #8e44ad;">
          <div class="header-left">
            <span class="platform-name">Gemini</span>
            <button class="toggle-btn enabled" data-platform-toggle="gemini" type="button" title="停用 Gemini">ON</button>
            <button class="refresh-btn" data-platform="gemini" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="gemini" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="gemini-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="gemini-iframe" src="https://gemini.google.com/app" allow="clipboard-write; clipboard-read"></iframe>
      </div>

      <div class="iframe-wrapper" data-platform="claude">
        <div class="iframe-header" style="background-color: #CC785C;">
          <div class="header-left">
            <span class="platform-name">Claude</span>
            <button class="toggle-btn enabled" data-platform-toggle="claude" type="button" title="停用 Claude">ON</button>
            <button class="refresh-btn" data-platform="claude" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="claude" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="claude-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="claude-iframe" src="https://claude.ai/new" allow="clipboard-write; clipboard-read"></iframe>
      </div>

      <div class="iframe-wrapper" data-platform="chatgpt">
        <div class="iframe-header" style="background-color: #27ae60;">
          <div class="header-left">
            <span class="platform-name">ChatGPT</span>
            <button class="toggle-btn enabled" data-platform-toggle="chatgpt" type="button" title="停用 ChatGPT">ON</button>
            <button class="refresh-btn" data-platform="chatgpt" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="chatgpt" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="chatgpt-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="chatgpt-iframe" src="https://chatgpt.com/" allow="clipboard-write; clipboard-read"></iframe>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
