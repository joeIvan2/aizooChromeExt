<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Multi-Chat</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 統一問題輸入區 -->
    <div class="input-section">
      <textarea id="question-input" data-i18n-placeholder="inputPlaceholder"></textarea>
      <button id="send-all-btn" data-i18n="sendToAllButton"></button>
      <button id="compare-btn" type="button" title="智慧對比所有答案">智慧對比</button>
      <button id="new-chat-btn" data-i18n="newChatButton"></button>
      <button id="history-toggle-btn" type="button" title="顯示歷史對話">歷史對話</button>
      <button id="minimize-input-btn" type="button" title="縮小控制面板">⤋</button>
    </div>

    <div id="session-switcher" class="session-switcher hidden" aria-label="對話組清單">
      <select id="session-select" title="選擇已記錄的對話組">
        <option value="">尚無對話組</option>
      </select>
      <button id="load-session-btn" type="button" title="切換所有平台到這組對話">切換</button>
      <button id="delete-session-btn" type="button" title="刪除這組對話紀錄">刪除</button>
      <button id="hide-session-btn" type="button" title="隱藏歷史對話">隱藏</button>
    </div>

    <!-- 4 個 AI iframe -->
    <div class="iframes-container">
      <div class="iframe-wrapper" data-platform="grok">
        <div class="iframe-header">
          <div class="header-left">
            <span class="platform-name">Grok</span>
            <button class="toggle-btn enabled" data-platform-toggle="grok" type="button" title="停用 Grok">ON</button>
            <button class="refresh-btn" data-platform="grok" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="grok" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="grok-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="grok-iframe" src="https://grok.com/" allow="clipboard-write; clipboard-read"></iframe>
      </div>

      <div class="iframe-wrapper" data-platform="gemini">
        <div class="iframe-header">
          <div class="header-left">
            <span class="platform-name">Gemini</span>
            <button class="toggle-btn enabled" data-platform-toggle="gemini" type="button" title="停用 Gemini">ON</button>
            <button class="refresh-btn" data-platform="gemini" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="gemini" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="gemini-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="gemini-iframe" src="https://gemini.google.com/app" allow="clipboard-write; clipboard-read"></iframe>
      </div>

      <div class="iframe-wrapper" data-platform="claude">
        <div class="iframe-header">
          <div class="header-left">
            <span class="platform-name">Claude</span>
            <button class="toggle-btn enabled" data-platform-toggle="claude" type="button" title="停用 Claude">ON</button>
            <button class="diagnose-btn" data-protect-platform="claude" type="button" title="Protect Claude Sidebar">P</button>
            <button class="diagnose-btn" data-breakpoint-platform="claude" type="button" title="Claude Sidebar Breakpoint">B</button>
            <button class="diagnose-btn" data-diagnose-platform="claude" type="button" title="Claude 診斷">D</button>
            <button class="refresh-btn" data-platform="claude" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="claude" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="claude-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="claude-iframe" src="https://claude.ai/new" allow="clipboard-write; clipboard-read"></iframe>
      </div>

      <div class="iframe-wrapper" data-platform="chatgpt">
        <div class="iframe-header">
          <div class="header-left">
            <span class="platform-name">ChatGPT</span>
            <button class="toggle-btn enabled" data-platform-toggle="chatgpt" type="button" title="停用 ChatGPT">ON</button>
            <button class="refresh-btn" data-platform="chatgpt" data-i18n-title="refreshTitle">⟳</button>
            <button class="maximize-btn" data-platform="chatgpt" data-i18n-title="maximizeTitle">⤢</button>
          </div>
          <span class="status" id="chatgpt-status" data-i18n-title="loadingTitle">⏳</span>
        </div>
        <iframe id="chatgpt-iframe" src="https://chatgpt.com/" allow="clipboard-write; clipboard-read"></iframe>
      </div>
    </div>

    <div id="diagnostics-panel" class="diagnostics-panel hidden">
      <div class="diagnostics-header">
        <span id="diagnostics-title">Diagnostics</span>
        <button id="close-diagnostics-btn" type="button" aria-label="Close diagnostics">×</button>
      </div>
      <pre id="diagnostics-output">尚未執行診斷</pre>
    </div>

    <!-- 智慧對比對照面板 -->
    <div id="compare-panel" class="compare-panel hidden">
      <div class="compare-header">
        <span class="compare-title">✨ 智慧答案橫向比對面版</span>
        <button id="close-compare-btn" type="button" aria-label="Close comparison">×</button>
      </div>
      <div class="compare-content">
        <div class="compare-prompt-area">
          <span class="compare-prompt-label">💬 最新問題：</span>
          <span id="compare-prompt-text">尚未發送問題，或正在等待平台回應...</span>
        </div>
        <div class="compare-grid">
          <div class="compare-col" data-platform="grok">
            <div class="col-title grok-title">Grok</div>
            <div class="col-text" id="compare-text-grok">等待載入對話...</div>
          </div>
          <div class="compare-col" data-platform="gemini">
            <div class="col-title gemini-title">Gemini</div>
            <div class="col-text" id="compare-text-gemini">等待載入對話...</div>
          </div>
          <div class="compare-col" data-platform="claude">
            <div class="col-title claude-title">Claude</div>
            <div class="col-text" id="compare-text-claude">等待載入對話...</div>
          </div>
          <div class="compare-col" data-platform="chatgpt">
            <div class="col-title chatgpt-title">ChatGPT</div>
            <div class="col-text" id="compare-text-chatgpt">等待載入對話...</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
