<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Multi-Chat - Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      align-items: center;
    }
    canvas {
      border: 1px solid #ddd;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 10px;
    }
    button:hover {
      background: #0056b3;
    }
    .instructions {
      background: #f8f9fa;
      padding: 15px;
      border-left: 4px solid #007bff;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>AI Multi-Chat - 圖標生成器</h1>

  <div class="instructions">
    <h3>使用說明：</h3>
    <ol>
      <li>點擊「生成圖標」按鈕</li>
      <li>分別右鍵點擊每個圖標 → 「另存新檔」</li>
      <li>保存為對應的檔名：icon16.png, icon48.png, icon128.png</li>
      <li>移動到 <code>icons/</code> 資料夾</li>
    </ol>
  </div>

  <button onclick="generateIcons()">生成圖標</button>
  <button onclick="downloadAll()">一鍵下載全部</button>

  <div class="icon-preview" id="preview">
    <!-- 圖標會在這裡顯示 -->
  </div>

  <script>
    function generateIcons() {
      const sizes = [16, 48, 128];
      const preview = document.getElementById('preview');
      preview.innerHTML = '';

      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // 漸變背景
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#4285f4');
        gradient.addColorStop(1, '#0d47a1');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);

        // 繪製 AI 文字
        ctx.fillStyle = 'white';
        ctx.font = `bold ${size * 0.4}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('AI', size / 2, size / 2);

        // 添加到預覽
        const wrapper = document.createElement('div');
        wrapper.style.textAlign = 'center';

        const label = document.createElement('div');
        label.textContent = `${size}x${size}`;
        label.style.marginBottom = '5px';
        label.style.fontSize = '12px';
        label.style.color = '#666';

        wrapper.appendChild(label);
        wrapper.appendChild(canvas);

        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = '下載';
        downloadBtn.style.marginTop = '5px';
        downloadBtn.style.fontSize = '12px';
        downloadBtn.style.padding = '4px 12px';
        downloadBtn.onclick = () => downloadIcon(canvas, `icon${size}.png`);
        wrapper.appendChild(downloadBtn);

        preview.appendChild(wrapper);
      });
    }

    function downloadIcon(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      const sizes = [16, 48, 128];

      sizes.forEach((size, index) => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // 漸變背景
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#4285f4');
        gradient.addColorStop(1, '#0d47a1');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);

        // 繪製 AI 文字
        ctx.fillStyle = 'white';
        ctx.font = `bold ${size * 0.4}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('AI', size / 2, size / 2);

        // 延遲下載，避免瀏覽器阻止
        setTimeout(() => {
          downloadIcon(canvas, `icon${size}.png`);
        }, index * 500);
      });
    }

    // 自動生成預覽
    window.addEventListener('load', generateIcons);
  </script>
</body>
</html>
